<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>캡슐 뽑기 이벤트</title>
<style>
  :root {
    --red: #ed1b23;
    --red-deep: #c9141b;
    --yellow: #fdb812;
    --gray: #58595b;
    --ink: #1b1b1d;
    --paper: #f5f2ec;
    --line: #e6e1d8;
    --muted: #7c7a76;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  html, body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input { -webkit-user-select: text; user-select: text; }
  body {
    font-family: "Pretendard", "Pretendard Variable", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(60% 55% at 50% 50%, #fbfaf7 0%, #fbfaf7 30%, rgba(251,250,247,0) 75%),
      radial-gradient(120% 80% at 50% 120%, #ebe5da 0%, rgba(235,229,218,0) 60%),
      var(--paper);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

  .app { height: 100vh; height: 100dvh; min-height: 560px; display: flex; flex-direction: column; }

  /* top bar */
  .top { flex: none; display: flex; align-items: center; justify-content: center; padding: 30px 20px 6px; }
  .logo-btn {
    appearance: none; border: 0; background: transparent; cursor: pointer; padding: 8px 10px; margin: -8px -10px;
    border-radius: 12px; display: flex; align-items: center; transition: background-color 200ms;
  }
  .logo-btn { cursor: default; -webkit-tap-highlight-color: transparent; user-select: none; }
  .logo-btn:focus { outline: none; }
  .logo-btn img { height: 58px; width: auto; aspect-ratio: 600 / 302; object-fit: contain; display: block; }
  .logo-btn { animation: fadeUp 800ms var(--ease-out) backwards; padding: 10px 14px; margin: -10px -14px; }
  .chip {
    appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.7);
    font-size: 14px; font-weight: 600; backdrop-filter: blur(6px);
    transition: border-color 160ms, background-color 160ms;
  }
  .chip:hover { border-color: #cfc8bc; background: #fff; }
  .top-actions { display: flex; gap: 8px; }
  .spk { position: relative; width: 14px; height: 12px; display: inline-block; }
  .spk::before { content: ""; position: absolute; left: 0; top: 3px; width: 5px; height: 6px; background: currentColor; border-radius: 1px; }
  .spk::after { content: ""; position: absolute; left: 3px; top: 0; border-style: solid; border-width: 6px 7px 6px 0; border-color: transparent currentColor transparent transparent; }
  .chip.off { color: var(--muted); }
  .chip.off .spk { opacity: .5; }
  .tabs { display: flex; gap: 6px; margin-top: 12px; }
  .tab { appearance: none; cursor: pointer; border: 1px solid var(--line); background: #fff; padding: 8px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tab .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
  .tab .badge:empty { display: none; }
  .muted-label { font-size: 14px; color: var(--ink); }
  .sound-btn { appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 14px; font-weight: 600; }
  .sound-btn:hover { border-color: var(--gray); }
  .sound-btn.off { color: var(--muted); }
  .sound-btn.off .spk { opacity: .5; }
  .chip .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 11px; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
  .chip .badge:empty { display: none; }

  /* stage */
  .stage { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: calc(28px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom)); }
  .stage > .eyebrow, .stage > h1 { animation: fadeUp 800ms var(--ease-out) backwards; }
  .stage > h1 { animation-delay: 80ms; }
  .stage > .pull { animation: fadeUp 800ms var(--ease-out) 260ms backwards; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.18em; color: var(--red); }
  .stage h1 { margin: 8px 0 0; font-size: clamp(28px, 4.2vw, 44px); line-height: 1.12; letter-spacing: -0.035em; font-weight: 800; }
  .view { position: relative; width: 100%; max-width: 1100px; flex: 1 1 0; min-height: 300px; }
  .view canvas {
    position: absolute; inset: 0;
    width: 100% !important; height: 100% !important; display: block;
    opacity: 0; transform: translateY(18px) scale(0.985);
    transition: opacity 900ms var(--ease-out), transform 1100ms var(--ease-out);
  }
  .view.ready canvas { opacity: 1; transform: none; }
  .view .fallback { position: absolute; inset: 0; display: none; place-items: center; color: var(--muted); font-size: 14px; padding: 24px; }
  .view.no3d .fallback { display: grid; }

  .pull {
    appearance: none; border: 0; cursor: pointer; position: relative; z-index: 2;
    margin-top: calc(22px - var(--dock, 0px));
    flex: none; width: min(440px, 88vw); padding: 24px 40px; border-radius: 22px;
    background: linear-gradient(180deg, #f2333a 0%, #e0161e 55%, #b8111a 100%); color: #fff;
    font-size: 30px; font-weight: 900; letter-spacing: 0.06em; text-shadow: 0 2px 0 rgba(0,0,0,0.18);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.35) inset,
      0 -4px 0 rgba(0,0,0,0.22) inset,
      0 0 0 6px #d6d4d0,
      0 0 0 7px rgba(0,0,0,0.08),
      0 26px 40px -18px rgba(120,10,14,0.65);
    transition: transform 140ms var(--ease-out), box-shadow 140ms var(--ease-out), filter 160ms;
  }
  .pull:hover:not(:disabled) { filter: brightness(1.05); }
  .pull:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(255,255,255,0.3) inset, 0 -1px 0 rgba(0,0,0,0.22) inset, 0 0 0 6px #d6d4d0, 0 0 0 7px rgba(0,0,0,0.08), 0 14px 24px -14px rgba(120,10,14,0.6); }
  .pull:disabled { cursor: not-allowed; opacity: 0.78; }
  .status { min-height: 22px; margin: 14px 0 0; font-size: 14px; color: var(--muted); }
  body.pulling .status::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  footer { text-align: center; padding: 8px 20px 22px; font-size: 12px; color: #a6a29b; }

  /* dialogs */
  dialog { border: 0; padding: 0; border-radius: 26px; background: #fff; color: var(--ink); box-shadow: 0 60px 100px -40px rgba(0,0,0,0.55); }
  dialog::backdrop { background: rgba(24,20,18,0.42); backdrop-filter: blur(6px); }
  dialog[open] { animation: pop 460ms var(--ease-out); }
  @keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
  .panel { width: min(600px, calc(100vw - 28px)); max-height: calc(100vh - 40px); }
  .dlg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 24px 26px 18px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { margin: 0; font-size: 19px; letter-spacing: -0.02em; }
  .dlg-head p { margin: 5px 0 0; font-size: 13px; color: var(--muted); }
  .x { width: 38px; height: 38px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 18px; line-height: 1; color: var(--gray); }
  .x:hover { border-color: var(--gray); color: var(--ink); }
  .dlg-body { padding: 18px 26px; overflow: auto; max-height: calc(100vh - 240px); }
  .dlg-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 16px 26px 22px; border-top: 1px solid var(--line); background: #fbfaf7; border-radius: 0 0 26px 26px; }
  .btn { appearance: none; cursor: pointer; white-space: nowrap; font-size: 14px; font-weight: 600; padding: 10px 15px; border-radius: 12px; border: 1px solid var(--line); background: #fff; transition: border-color 160ms, background-color 160ms; }
  .btn:hover { border-color: var(--gray); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--ink); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.primary:hover { background: #333336; }

  .section-label { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); margin: 4px 0 10px; }
  .bar { display: flex; height: 16px; border-radius: 999px; overflow: hidden; background: #efebe4; }
  .bar span { display: block; height: 100%; transition: width 420ms var(--ease-out); }
  .item-row { display: grid; grid-template-columns: minmax(0, 1fr) 76px 36px; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .item-row:last-child { border-bottom: 0; }
  .item-row .sw { width: 14px; height: 14px; border-radius: 50%; }
  .item-row .nm { width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line); background: #fbfaf8; }
  .item-row .val { text-align: right; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .item-row .ctrl { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; }
  .item-row input[type="range"] { flex: 1; accent-color: var(--red); cursor: pointer; }
  .item-row .w { width: 66px; font: inherit; font-size: 14px; padding: 7px 9px; border-radius: 10px; text-align: right; border: 1px solid var(--line); background: #fbfaf8; font-variant-numeric: tabular-nums; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: #f1eee8; }
  .seg button { appearance: none; border: 0; cursor: pointer; padding: 12px 10px; border-radius: 11px; background: transparent; font-size: 15px; font-weight: 700; color: var(--muted); transition: background-color 160ms, color 160ms, box-shadow 160ms; }
  .seg button[aria-checked="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 4px 12px -6px rgba(0,0,0,0.25); }
  .mode-help { margin: 10px 2px 18px; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .toggle[hidden] { display: none; }
  .item-row .val small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
  .item-row .ctrl-label { font-size: 13px; color: var(--muted); margin-right: auto; }
  .item-row .step { width: 40px; height: 40px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: #fff; font-size: 20px; line-height: 1; cursor: pointer; color: var(--ink); }
  .item-row .step:active { background: #f3f1ec; }
  .item-row .q { width: 96px; font: inherit; font-size: 17px; font-weight: 700; padding: 8px 10px; border-radius: 12px; text-align: center; border: 1px solid var(--line); background: #fbfaf8; font-variant-numeric: tabular-nums; -webkit-user-select: text; user-select: text; }
  .item-row .rank { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
  .item-row .rm[hidden] { display: block; visibility: hidden; }
  .item-row .rm { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 18px; line-height: 1; color: var(--gray); align-self: start; }
  .item-row .rm:hover { border-color: var(--red); color: var(--red); }
  .item-row .rm:disabled { opacity: .35; cursor: not-allowed; }
  .item-row.done .nm { text-decoration: line-through; color: var(--muted); }
  .tools { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; user-select: none; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--red); margin: 0; }
  .toggle small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .warn { color: var(--red-deep); font-size: 13px; min-height: 18px; margin: 10px 0 0; }

  .tally { list-style: none; margin: 0 0 18px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tally li { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #f7f5f1; font-size: 14px; }
  .tally .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .tally .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tally b { font-variant-numeric: tabular-nums; }
  .hist { list-style: none; margin: 0; padding: 0; }
  .hist li { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .hist li:last-child { border-bottom: 0; }
  .hist li.empty { display: block; color: var(--muted); font-size: 14px; }
  .hist .no { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #f5f3ef; font-size: 12px; font-weight: 700; color: var(--gray); }
  .hist .time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* result */
  dialog.result { width: min(420px, calc(100vw - 28px)); background: transparent; box-shadow: none; overflow: visible; --g1: #f9dc74; --g2: #c48a06; --glow: #f5c542; }
  dialog.result[open] { animation: none; }
  .r-card {
    position: relative; background: #fff; border-radius: 30px; padding: 42px 32px 28px; text-align: center; overflow: hidden;
    box-shadow: 0 60px 100px -40px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.04);
    animation: rise 620ms var(--ease-out) both;
  }
  @keyframes rise { 0% { opacity: 0; transform: translateY(70px) scale(0.25); } 55% { opacity: 1; transform: translateY(-6px) scale(1.04); } 100% { opacity: 1; transform: none; } }
  .r-kicker { position: relative; font-size: 16px; font-weight: 800; letter-spacing: 0.22em; color: var(--ink); }
  .r-rank {
    position: relative; display: inline-block; margin: 6px 0 2px;
    font-size: clamp(84px, 22vw, 128px); font-weight: 900; letter-spacing: -0.05em; line-height: 1.05;
    background: linear-gradient(175deg, var(--g1) 0%, var(--g1) 22%, var(--g2) 72%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 0 color-mix(in srgb, var(--g2) 70%, #000));
    animation: rankIn 760ms var(--ease-spring) 140ms both;
  }
  .r-rank::after { /* light sweep */
    content: attr(data-text); position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.95) 50%, transparent 65%);
    background-size: 250% 100%; background-position: 130% 0;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: sweep 1400ms ease-in-out 700ms both;
  }
  @keyframes rankIn { from { opacity: 0; transform: scale(0.55); } to { opacity: 1; transform: none; } }
  @keyframes sweep { from { background-position: 130% 0; } to { background-position: -30% 0; } }
  .r-sub { position: relative; font-size: 18px; font-weight: 700; color: var(--ink); }
  .r-close { margin-top: 26px; width: 100%; padding: 15px; font-size: 16px; border-radius: 16px; }

  dialog.confirm { width: min(360px, calc(100vw - 32px)); }
  .c-card { padding: 28px 26px 22px; text-align: center; }
  .c-card h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
  .c-card p { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
  .c-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
  .c-actions .btn { padding: 13px; font-size: 15px; border-radius: 14px; }
  canvas.confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 2147483647; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (min-width: 700px) and (orientation: portrait) {
    .pull { width: min(600px, 74vw); padding: 34px 40px; font-size: 38px; border-radius: 28px; }
    .stage { padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
    dialog.result { width: min(520px, 80vw); }
    .r-card { padding: 54px 40px 34px; }
    .r-rank { font-size: 150px; }
    .r-kicker { font-size: 20px; }
    .r-sub { font-size: 22px; }
    .r-close { padding: 20px; font-size: 19px; }
    .c-card h2 { font-size: 24px; }
    .c-actions .btn { padding: 16px; font-size: 17px; }
    dialog.panel { width: min(680px, 88vw); }
  }
  @media (max-width: 560px) {
    .top { padding: 16px 16px 0; }
    .logo-btn img { height: 28px; }
    .pull { font-size: 24px; padding: 20px 28px; }
    .logo-btn img { height: 44px; }
    .top { padding-top: 22px; }
    .tally { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; transition-duration: 0.01ms !important; }
  }
  /* fullscreen toggle */
  .fs-btn {
    position: fixed; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); z-index: 20;
    appearance: none; cursor: pointer; width: 44px; height: 44px; border-radius: 12px; padding: 0;
    display: grid; place-items: center; color: var(--gray);
    border: 1px solid var(--line); background: rgba(255,255,255,0.75); backdrop-filter: blur(6px);
    transition: background-color 160ms, border-color 160ms, color 160ms, transform 160ms var(--ease-out);
    animation: fadeUp 800ms var(--ease-out) backwards;
  }
  .fs-btn:hover { background: #fff; border-color: #cfc8bc; color: var(--ink); }
  .fs-btn:active { transform: scale(0.94); }
  .fs-btn svg { width: 20px; height: 20px; display: block; }
  .fs-btn[hidden] { display: none; }
  body.pulling .fs-btn { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="app">
  <button class="fs-btn" id="fs-btn" type="button" aria-label="전체화면" title="전체화면" hidden>

  <main class="stage" id="stage">
    <h1 class="sr-only">캡슐 뽑기</h1>
    <div class="view" id="view" aria-hidden="true">
      <div class="fallback">3D 화면을 표시할 수 없는 환경입니다. 뽑기는 그대로 진행됩니다.</div>
    </div>
    <button class="pull" id="pull" type="button"><span id="pull-label">뽑기</span></button>
    <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  </main>
</div>

<dialog id="settings" class="panel" aria-labelledby="settings-title">
  <div class="dlg-head">
    <div>
      <h2 id="settings-title">설정</h2>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-items" aria-selected="true" aria-controls="pane-items" type="button">등수 설정</button>
        <button class="tab" role="tab" id="tab-history" aria-selected="false" aria-controls="pane-history" type="button">뽑기 기록 <span class="badge" id="history-count"></span></button>
      </div>
    </div>
    <button class="x" id="close-settings" type="button" aria-label="닫기">×</button>
  </div>
  <div class="dlg-body" id="pane-items" role="tabpanel" aria-labelledby="tab-items">
    <div class="seg" role="radiogroup" aria-label="추첨 방식">
      <button type="button" role="radio" data-mode="prob" aria-checked="true">확률 기준</button>
      <button type="button" role="radio" data-mode="count" aria-checked="false">개수 기준</button>
    </div>
    <p class="mode-help" id="mode-help"></p>
    <div class="section-label"><span id="dist-label">확률 분포</span><span id="item-count"></span></div>
    <div class="bar" id="s-bar" aria-hidden="true"></div>
    <div id="item-list" style="margin-top:6px"></div>
    <div class="tools">
      <button class="btn" id="add-item" type="button">+ 등수 추가</button>
      <label class="toggle" id="exclude-row">
        <input type="checkbox" id="exclude">
        <span>뽑힌 등수 제외<small>한 번 나온 등수는 다음 뽑기에서 빠집니다</small></span>
      </label>
    </div>
    <div class="tools">
      <span class="muted-label">효과음</span>
      <button class="sound-btn" id="sound" type="button" aria-pressed="true"><span class="spk" aria-hidden="true"></span><span class="lbl">소리 켬</span></button>
    </div>
    <p class="warn" id="sum-warn"></p>
  </div>
  <div class="dlg-body" id="pane-history" role="tabpanel" aria-labelledby="tab-history" hidden>
    <ul class="tally" id="tally"></ul>
    <ol class="hist" id="history"></ol>
    <div style="margin-top:14px"><button class="btn ghost" id="clear-history" type="button">기록 지우기</button></div>
  </div>
  <div class="dlg-foot">
    <div>
      <button class="btn ghost" id="reset-items" type="button">기본값으로</button>
      <button class="btn ghost" id="reset-round" type="button">추첨 초기화</button>
    </div>
    <button class="btn primary" id="done-settings" type="button">적용하고 닫기</button>
  </div>
</dialog>

<dialog id="confirm" class="confirm" aria-labelledby="confirm-title">
  <div class="c-card">
    <h2 id="confirm-title">설정을 열까요?</h2>
    <p>등수와 확률, 뽑기 기록을 관리합니다.</p>
    <div class="c-actions">
      <button class="btn" id="confirm-no" type="button">취소</button>
      <button class="btn primary" id="confirm-yes" type="button">열기</button>
    </div>
  </div>
</dialog>

<dialog id="result" class="result" aria-labelledby="r-prize">
  <div class="r-card">
    <div class="r-kicker">축하합니다</div>
    <div class="r-rank" id="r-prize"></div>
    <div class="r-sub">당첨되었습니다</div>
    <button class="btn primary r-close" id="r-close" type="button">확인</button>
  </div>
  <canvas class="confetti" id="confetti" aria-hidden="true" hidden></canvas>
</dialog>

<script>
(() => {
  const btn = document.getElementById("fs-btn");
  const root = document.documentElement;
  const req = root.requestFullscreen || root.webkitRequestFullscreen;
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const standalone = matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches || navigator.standalone;
  if (!req || standalone) return;
  const sync = () => { btn.hidden = !!fsEl(); };
  btn.addEventListener("click", () => {
    btn.blur();
    try { const p = req.call(root, { navigationUI: "hide" }); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", sync);
  document.addEventListener("webkitfullscreenchange", sync);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && fsEl()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  });
  sync();
})();
